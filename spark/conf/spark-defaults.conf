# Ap dung cho moi spark-submit trong cum (master + worker).
spark.master                                   spark://spark-master:7077
spark.sql.session.timeZone                     UTC
spark.sql.shuffle.partitions                   8
spark.executor.memory                          1g
spark.cores.max                                2
spark.driver.memory                            1g

# MinIO qua S3A. Credential lay tu bien moi truong AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.fast.upload                true
spark.sql.parquet.compression.codec            snappy
spark.sql.streaming.checkpointFileManagerClass org.apache.spark.sql.execution.streaming.FileSystemBasedCheckpointFileManager
