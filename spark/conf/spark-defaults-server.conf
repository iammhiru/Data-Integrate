# ============================================================================
#  Spark config cho MÁY SERVER 192.168.179.176 (Linux, chạy trong Docker)
#
#  Mount vao: /opt/spark/conf/spark-defaults.conf  (xem docker-compose.spark-server.yml)
#
#  KHAC spark/conf/spark-defaults.conf (dung cho compose local):
#    · spark.master = local[*]   -> khong dung spark://spark-master:7077
#      (server da co dich vu dung port 8080/8081; master/worker them container
#       + them port, khong can cho nhom job nay)
#    · s3a endpoint = IP HOST 192.168.179.176:4434 (khong dung http://minio:9000)
#      -> MinIO Data Lake chay o compose project RIENG (smart-factory-datalake)
#         nen khong chung network voi Spark.
#    · pg jdbc     = IP HOST 192.168.179.176:5432 (tuong tu, Postgres o
#      compose project smart-factory-server).
# ============================================================================

spark.master                                   local[4]
spark.sql.session.timeZone                     UTC
spark.sql.shuffle.partitions                   8
spark.executor.memory                          1g
spark.cores.max                                2
spark.driver.memory                             1g

# Driver chay trong container network_mode: host -> bind IP host de
# client LAN (Spark UI) vao duoc. KHONG dung 127.0.0.1 (trong container la
# chinh container, khong phai host).
spark.driver.host                              192.168.179.176
spark.driver.bindAddress                       192.168.179.176

spark.ui.enabled                               true
spark.ui.port                                  4040

# Checkpoint Structured Streaming: dung FileSystemBased (HDFS) de
# FileContextBased (LocalFS) gay loi khi container doi image.
spark.sql.streaming.checkpointFileManagerClass org.apache.spark.sql.execution.streaming.FileSystemBasedCheckpointFileManager

# --- S3A (MinIO Data Lake) ----------------------------------------------------
# Endpoint: host 192.168.179.176, port 4434 (publish cua container sf-minio-dl).
# Can jar: hadoop-aws-3.3.4.jar + aws-java-sdk-bundle-1.12.262.jar
#          (da COPY vao /opt/spark/jars trong Dockerfile.server).
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                   http://192.168.179.176:4434
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.fast.upload                true
spark.hadoop.fs.s3a.connection.maximum         200
spark.hadoop.fs.s3a.connection.timeout         120000
spark.hadoop.fs.s3a.committer.name             magic
spark.sql.parquet.compression.codec            snappy

# --- Kafka --------------------------------------------------------------------
# Khong can khai bao them: job truyen --bootstrap qua CLI.
spark.sql.shuffle.partitions                   8
