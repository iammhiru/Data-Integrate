# Gateway cho MES Dashboard khi chay bang docker compose.
# Thay the proxy cua Vite dev server (dashboard/frontend/vite.config.ts):
#   /state-api/*  -> state-api:8000   (boc tien to; co WebSocket /ws/machines)
#   /master-api/* -> master-api:8001  (boc tien to)
#   con lai       -> dashboard:8080   (.NET: UI tinh + /api + /hubs SignalR)
# Dung resolver Docker + bien de nginx van khoi dong khi state-api (profile
# telemetry) chua chay; request toi upstream chua co se tra 502.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;

    location /state-api/ {
        set $state_api http://state-api:8000;
        rewrite ^/state-api/(.*)$ /$1 break;
        proxy_pass $state_api;
    }

    location /master-api/ {
        set $master_api http://master-api:8001;
        rewrite ^/master-api/(.*)$ /$1 break;
        proxy_pass $master_api;
    }

    location / {
        set $dashboard http://dashboard:8080;
        # .NET AllowedHosts chi nhan localhost/127.0.0.1/dashboard
        proxy_set_header Host localhost;
        proxy_pass $dashboard;
    }
}
