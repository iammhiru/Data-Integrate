# Ap dung cho moi spark-submit/spark-shell chay LOCAL tren Windows.
# master: local[*] — khong co Docker/Spark cluster.
spark.master                                   local[4]
spark.sql.session.timeZone                     UTC
spark.sql.shuffle.partitions                   2
spark.executor.memory                          2g
spark.cores.max                                4
spark.driver.memory                            2g
spark.driver.host                              127.0.0.1
spark.driver.bindAddress                       127.0.0.1
spark.ui.enabled                               false
spark.sql.streaming.checkpointFileManagerClass org.apache.spark.sql.execution.streaming.FileSystemBasedCheckpointFileManager

# Windows khong co native hadoop.dll (chi phat hanh tren GitHub) -> FileUtil.canRead ->
# NativeIO$Windows.access0 nem UnsatisfiedLinkError. Patch bang class cua bo san trong repo.
spark.hadoop.fs.file.impl                      org.apache.hadoop.fs.PatchedLocalFileSystem

# --- S3A (MinIO) cho duong batch: Kafka -> MinIO raw -> PostgreSQL fact ---
# Endpoint: MinIO tren may server 192.168.179.176, publish host port 4434 (S3 API).
# Can jar: hadoop-aws-3.3.4.jar + aws-java-sdk-bundle-1.12.262.jar
#          (scripts\fetch-jars.ps1 tai ve scripts\jars\)
# Credential lay tu bien moi truong AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# (script run-raw-ingest.ps1 / run-batch-kpi.ps1 tu gan tu .env).
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                   http://192.168.179.176:4434
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.fast.upload                true
spark.hadoop.fs.s3a.connection.maximum         200
spark.hadoop.fs.s3a.connection.timeout         120000
spark.sql.parquet.compression.codec            snappy
