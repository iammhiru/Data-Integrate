name: smart-factory

x-spark-common: &spark-common
  build:
    context: ./docker/spark
  image: smart-factory/spark:3.5.5
  env_file: .env
  environment:
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_REGION: us-east-1
  volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/apps:/opt/spark-apps:ro
    - spark-checkpoints:/opt/spark-checkpoints   # checkpoint/state store dung chung driver + executor
  networks: [smart-factory]

x-spark-job: &spark-job
  <<: *spark-common
  profiles: ["streaming"]
  restart: unless-stopped
  depends_on:
    spark-master:
      condition: service_healthy
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- Kafka (KRaft, 1 node)
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"            # client tu may host: localhost:9094
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks: [smart-factory]

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"
    networks: [smart-factory]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8082:8080"            # http://localhost:8082
    environment:
      KAFKA_CLUSTERS_0_NAME: smart-factory
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [smart-factory]

  # ---------------------------------------------------------------- MinIO (Data Lake)
  # Image minio/minio da bi go khoi Docker Hub/quay.io; alpine/minio build tu source chinh thuc.
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    hostname: minio
    user: "0:0"                # image chay user 'minio', khong ghi duoc vao named volume (owner root)
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"            # S3 API
      - "9001:9001"            # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [smart-factory]

  # Tao bucket bang AWS CLI (S3 API), chay mot lan roi thoat.
  minio-init:
    image: amazon/aws-cli:2.27.0
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$MINIO_BUCKET" 2>/dev/null \
          || aws --endpoint-url http://minio:9000 s3 mb "s3://$$MINIO_BUCKET"
        echo "bucket $$MINIO_BUCKET ready"
    restart: "no"
    networks: [smart-factory]

  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [smart-factory]

  # ---------------------------------------------------------------- Spark standalone cluster
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"            # Spark master UI
      - "7077:7077"
      - "4040:4040"            # Spark application UI (driver chay trong spark-master)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 5s
      timeout: 5s
      retries: 12

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}",
              "--webui-port", "8081", "spark://spark-master:7077"]
    ports:
      - "8081:8081"            # Spark worker UI
    depends_on:
      spark-master:
        condition: service_healthy

  # ---------------------------------------------------------------- Streaming jobs (profile: streaming)
  # docker compose --profile streaming up -d
  # Driver chay trong container rieng (client mode), executor chay tren spark-worker.
  stream-raw-ingest:
    <<: *spark-job
    container_name: stream-raw-ingest
    hostname: stream-raw-ingest
    command: ["/opt/spark/bin/spark-submit",
              "--conf", "spark.cores.max=1", "--conf", "spark.driver.memory=512m",
              "--conf", "spark.driver.host=stream-raw-ingest",
              "/opt/spark-apps/kafka_to_minio.py", "--trigger", "1 minute"]
    ports:
      - "4041:4040"            # Spark UI cua job raw ingest

  stream-realtime:
    <<: *spark-job
    container_name: stream-realtime
    hostname: stream-realtime
    command: ["/opt/spark/bin/spark-submit",
              "--conf", "spark.cores.max=3", "--conf", "spark.driver.memory=512m",
              "--conf", "spark.driver.host=stream-realtime",
              "--conf", "spark.sql.shuffle.partitions=3",
              "--conf", "spark.sql.streaming.stateStore.providerClass=org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider",
              "--conf", "spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled=true",
              "/opt/spark-apps/realtime_metrics.py"]
    ports:
      - "4042:4040"            # Spark UI cua job realtime

  dashboard:
    build:
      context: ./dashboard
    image: smart-factory/dashboard:local
    environment:
      Telemetry__Mode: Kafka
      Kafka__Format: Metrics
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: realtime-metrics
      Kafka__GroupId: dashboard-metrics-v1
      Kafka__AutoOffsetReset: Earliest
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=15"
      AllowedHosts: "localhost;127.0.0.1;dashboard"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5080}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [smart-factory]
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

volumes:
  spark-checkpoints:
  kafka-data:
  minio-data:
  postgres-data:

networks:
  smart-factory:
    name: smart-factory
